
services:
  churnguard-api:
    build:
      context: .
      dockerfile: Dockerfile.production

    image: churnguard-ai:2.0.0-production
    container_name: churnguard-production

    ports:
      - "8000:8000"

    env_file:
      - .env.production.example

    environment:
      APP_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 8000

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - http://127.0.0.1:8000/health
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

    init: true

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M